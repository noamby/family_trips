    <style>

        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #f8fafc;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        /* Hide scrollbar for navs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {

            <!-- Injected via JS -->

                            gfEats: [{ name: "Canon Café", type: "Cafe • Open 10am-5pm", note: "Offers GF soup and bread, but double-check cross-contamination practices on busy days." }]

                    },
                    {
                        dayLabel: "Day 14",
                        optionA: {
                            type: "Nature",
                            title: "Utrechtse Heuvelrug Woods",
                            images: ["https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"],
                            tags: ["Forest", "Farewell Walk"],
                            desc: "A final, peaceful morning walk through the ancient oak and beech forests of the Utrecht ridge before packing up the RV.",
                            mapLink: "https://maps.google.com/?q=Utrechtse+Heuvelrug",
                            gfEats: [{ name: "Jumbo Supermarket (Arnhem)", type: "Grocery • Open 8am-9pm", note: "Stock up on GF Dutch treats (like GF Stroopwafels if you can find them!) to take home." }]
                        },
                        optionB: {
                            type: "Action",
                            title: "Ouwehands Zoo",
                            images: ["https://images.unsplash.com/photo-1564883495267-b52b2f6bb8c8?auto=format&fit=crop&w=800&q=80"],
                            tags: ["Giant Pandas", "Playground"],
                            desc: "Famous for its Giant Pandas and 'RavotAapia', Europe's largest covered indoor jungle playground. A high-energy end to the trip.",
                            mapLink: "https://maps.google.com/?q=Ouwehands+Dierenpark",
                            gfEats: [{ name: "Jungle Restaurant", type: "Restaurant • Open 10am-5pm", note: "Dedicated GF fryers for chips/fries. Ask staff for the allergy binder." }]
                        }
                    }
                ]
            }
        ];

        let state = {
            campIndex: 0,
            dayIndex: 0,
            option: 'A' // 'A' or 'B'
        };

        function initApp() {
            renderCampNav();
            renderDayNav();
            updateToggleUI();
            renderContent();
        }

        function setCamp(index) {
            state.campIndex = index;
            state.dayIndex = 0; // Reset to first day of new camp
            renderCampNav();
            renderDayNav();
            renderContent();
        }

        function setDay(index) {
            state.dayIndex = index;
            renderContent();
            renderDayNav(); // Re-render to update active styling
        }

        function setOption(opt) {
            state.option = opt;
            updateToggleUI();
            renderContent();
        }

        function renderCampNav() {
            const nav = document.getElementById('camp-nav');
            nav.innerHTML = tripData.map((camp, index) => {
                const isActive = state.campIndex === index;
                return `
                    <button onclick="setCamp(${index})" class="whitespace-nowrap px-4 py-2.5 rounded-xl text-sm font-bold transition-all duration-200 border-2 ${isActive ? 'bg-white text-base border-white shadow-sm' : 'bg-transparent text-white/70 border-white/20 hover:bg-white/10'}">
                        ${camp.shortName}
                    </button>
                `;
            }).join('');
        }

        function renderDayNav() {
            const nav = document.getElementById('day-nav');
            const currentCamp = tripData[state.campIndex];
            nav.innerHTML = currentCamp.days.map((day, index) => {
                const isActive = state.dayIndex === index;
                return `
                    <button onclick="setDay(${index})" class="flex-1 whitespace-nowrap px-5 py-2.5 rounded-xl text-sm font-black transition-all ${isActive ? 'bg-slate-800 text-white shadow-md scale-100' : 'bg-slate-100 text-slate-500 hover:bg-slate-200 scale-95'}">
                        ${day.dayLabel}
                    </button>
                `;
            }).join('');
        }

        function updateToggleUI() {
            const btnA = document.getElementById('toggle-A');
            const btnB = document.getElementById('toggle-B');

            if (state.option === 'A') {
                btnA.className = "flex-1 py-3 text-sm font-black rounded-xl transition-all duration-300 z-10 flex items-center justify-center gap-2 bg-white text-nature shadow-md border border-slate-100 scale-100";
                btnB.className = "flex-1 py-3 text-sm font-bold rounded-xl transition-all duration-300 z-10 flex items-center justify-center gap-2 bg-transparent text-slate-400 scale-95 opacity-70 hover:opacity-100";
            } else {
                btnB.className = "flex-1 py-3 text-sm font-black rounded-xl transition-all duration-300 z-10 flex items-center justify-center gap-2 bg-white text-action shadow-md border border-slate-100 scale-100";
                btnA.className = "flex-1 py-3 text-sm font-bold rounded-xl transition-all duration-300 z-10 flex items-center justify-center gap-2 bg-transparent text-slate-400 scale-95 opacity-70 hover:opacity-100";
            }
        }

        function renderContent() {
            const container = document.getElementById('content-area');
            const currentCamp = tripData[state.campIndex];
            const currentDay = currentCamp.days[state.dayIndex];
            const data = state.option === 'A' ? currentDay.optionA : currentDay.optionB;

            const themeColorClass = state.option === 'A' ? 'text-nature' : 'text-action';
            const bgThemeClass = state.option === 'A' ? 'bg-teal-50' : 'bg-orange-50';
            const btnClass = state.option === 'A' ? 'bg-nature hover:bg-teal-700' : 'bg-action hover:bg-orange-700';

            // Image Gallery HTML (Using first image as Hero)
            let heroImage = data.images && data.images.length > 0 ? data.images[0] : 'https://placehold.co/800x600/cbd5e1/ffffff?text=Image+Not+Found';

            // Tags HTML
            let tagsHtml = data.tags.map(tag =>
                `<span class="text-xs px-3 py-1.5 rounded-lg bg-white border border-slate-200 font-bold text-slate-600 shadow-sm flex items-center gap-1.5">${tag}</span>`
            ).join('');

            // Gluten Free Eats HTML
            let gfHtml = '';
            if (data.gfEats && data.gfEats.length > 0) {
                gfHtml = `
                    <div class="mt-8 bg-purple-50 border-2 border-purple-100 rounded-2xl p-5 shadow-sm relative overflow-hidden">
                        <div class="absolute -right-6 -top-6 opacity-5 rotate-12">
                            <i class="fa-solid fa-wheat-awn-circle-exclamation text-9xl text-gf"></i>
                        </div>
                        <h4 class="text-gf font-black text-sm uppercase tracking-wider mb-4 flex items-center gap-2 relative z-10">
                            <i class="fa-solid fa-shield-heart text-lg"></i> Celiac Safe Eats Nearby
                        </h4>
                        <div class="space-y-3 relative z-10">
                            ${data.gfEats.map(eat => `
                                <div class="bg-white rounded-xl p-3.5 border border-purple-50 shadow-sm">
                                    <div class="flex justify-between items-start mb-1.5">
                                        <h5 class="font-extrabold text-slate-800 text-sm leading-tight pr-2">${eat.name}</h5>
                                    </div>
                                    <span class="inline-block text-[10px] uppercase font-bold text-purple-700 bg-purple-100 px-2.5 py-1 rounded-md mb-2">
                                        <i class="fa-regular fa-clock mr-1"></i> ${eat.type}
                                    </span>
                                    <p class="text-xs text-slate-600 leading-relaxed font-semibold">${eat.note}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Build the full content layout
            container.innerHTML = `
                <div class="fade-in pb-8">

                    <!-- Hero Image -->
                    <div class="rounded-2xl overflow-hidden shadow-md mb-5 relative h-56 bg-slate-200">
                        <img src="${heroImage}" class="w-full h-full object-cover" alt="${data.title}">
                        <div class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full shadow-sm text-[10px] font-black uppercase tracking-widest ${themeColorClass}">
                            Option ${state.option}
                        </div>
                    </div>

                    <!-- Title & Tags -->
                    <div class="mb-5 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <h2 class="text-2xl font-black text-slate-800 leading-tight mb-4">${data.title}</h2>

                        <div class="flex flex-wrap gap-2 mb-4">
                            ${tagsHtml}
                        </div>

                        <p class="text-slate-600 text-sm leading-relaxed font-medium">
                            ${data.desc}
                        </p>
                    </div>

                    <!-- Action Button -->
                    <a href="${data.mapLink}" target="_blank" class="w-full flex items-center justify-center gap-2 ${btnClass} text-white font-black py-4 rounded-2xl shadow-lg transition-transform active:scale-95">
                        <i class="fa-solid fa-location-arrow text-lg"></i> Open in Google Maps
                    </a>

                    <!-- Gluten Free Section -->
                    ${gfHtml}

                </div>
            `;
        }

        // Boot the app
        window.onload = initApp;

    </script>
</body>
</html>
