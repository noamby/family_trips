<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Euro RV '27 Planner</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        nature: '#14b8a6',   
                        action: '#f97316',   
                        base: '#0f172a',     
                        accent: '#fbbf24',   
                        gf: '#a855f7',       
                        camp: '#3b82f6'      
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #e2e8f0; 
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 768px;
            margin: 0 auto;
            background-color: #f8fafc;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none; 
        }
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-badge {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
        /* Map custom marker overrides */
        .leaflet-div-icon {
            background: transparent;
            border: none;
        }
        .leaflet-bottom.leaflet-right {
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <div class="app-container">
        
        <!-- HEADER -->
        <header class="bg-slate-900 text-white pt-6 pb-4 px-4 sm:px-8 shadow-lg z-30 shrink-0 relative">
            <div class="flex justify-between items-center mb-5">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black tracking-wide text-white drop-shadow-sm">Euro RV '27</h1>
                    <p class="text-xs sm:text-sm text-accent font-bold uppercase tracking-wider mt-1"><i class="fa-solid fa-calendar-days mr-1"></i> August 14-28, 2027</p>
                </div>
                
                <div class="flex gap-2 sm:gap-3">
                    <a href="https://maps.google.com/?q=Amsterdam+Airport" target="_blank" class="bg-white/10 hover:bg-white/20 transition-colors w-10 h-10 rounded-xl border border-white/20 flex items-center justify-center" title="Flights">
                        <i class="fa-solid fa-plane-departure text-white text-lg"></i>
                    </a>
                    <a href="https://maps.google.com/?q=RV+Rental" target="_blank" class="bg-white/10 hover:bg-white/20 transition-colors w-10 h-10 rounded-xl border border-white/20 flex items-center justify-center" title="RV Rental">
                        <i class="fa-solid fa-caravan text-accent text-lg"></i>
                    </a>
                    <button onclick="startCloudSync(true)" class="relative bg-blue-600 hover:bg-blue-500 transition-colors w-10 h-10 rounded-xl border border-blue-400 shadow-[0_0_15px_rgba(37,99,235,0.5)] flex items-center justify-center group overflow-hidden" title="Sync Offline Data">
                        <div id="sync-button-bg" class="absolute inset-0 pointer-events-none transition-all duration-300" style="background: conic-gradient(rgba(255,255,255,0.3) 0%, transparent 0%);"></div>
                        <div class="relative z-10 w-full h-full flex items-center justify-center">
                            <i class="fa-solid fa-sync group-hover:rotate-180 transition-transform duration-500 text-white text-lg" id="sync-icon"></i>
                        </div>
                    </button>
                </div>
            </div>

            <!-- VIEW TOGGLE -->
            <div class="bg-slate-800 p-1.5 rounded-xl flex max-w-[280px] mx-auto mb-5 relative shadow-inner">
                <button onclick="switchView('list')" id="tab-list" class="flex-1 py-1.5 text-xs font-black rounded-lg transition-all text-slate-900 bg-white shadow-sm flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-list-ul"></i> List View
                </button>
                <button onclick="switchView('map')" id="tab-map" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-map-location-dot"></i> Map View
                </button>
            </div>

            <div class="flex justify-between items-center mb-3">
                <h2 class="text-[10px] uppercase tracking-widest text-slate-400 font-bold" id="region-nav-title">Select Region / Base Camp</h2>
            </div>
            <nav id="camp-nav" class="flex space-x-3 overflow-x-auto no-scrollbar pb-2 snap-x"></nav>
        </header>

        <!-- LIST VIEW SECTIONS -->
        <div id="list-view-container" class="flex flex-col flex-1 overflow-hidden relative">
            <div id="camp-site-banner" class="bg-blue-50 border-b border-blue-100 px-4 sm:px-8 py-3 shrink-0 flex items-center justify-between z-20">
                <!-- Injected via JS -->
            </div>

            <div class="bg-white border-b border-slate-200 z-10 shrink-0 px-4 sm:px-8 pt-3 pb-3 shadow-sm">
                <nav id="day-nav" class="flex overflow-x-auto no-scrollbar space-x-2 sm:space-x-4 snap-x"></nav>
            </div>

            <div class="px-4 sm:px-8 pt-5 pb-2 shrink-0 bg-slate-50 z-10">
                <div class="flex bg-slate-200 p-1.5 rounded-2xl relative max-w-md mx-auto w-full">
                    <button id="toggle-A" onclick="setOption('A')" class="flex-1 py-3 text-sm sm:text-base font-black rounded-xl transition-all duration-300 z-10 flex items-center justify-center gap-2"></button>
                    <button id="toggle-B" onclick="setOption('B')" class="flex-1 py-3 text-sm sm:text-base font-black rounded-xl transition-all duration-300 z-10 flex items-center justify-center gap-2"></button>
                </div>
            </div>

            <main id="content-area" class="flex-1 overflow-y-auto px-4 sm:px-8 pb-16 pt-4 no-scrollbar relative bg-slate-50">
                <!-- Dynamic Injection -->
            </main>
        </div>

        <!-- MAP VIEW CONTAINER -->
        <div id="map-view-container" class="hidden flex-1 relative w-full h-full z-10">
            <!-- Leaflet Map attaches here -->
            <div id="map" class="absolute inset-0 w-full h-full"></div>
            
            <!-- Map Interactive Filter Legend -->
            <div class="absolute top-4 left-4 right-4 z-[400] flex justify-center pointer-events-none">
                <div class="bg-white/90 backdrop-blur shadow-lg rounded-full px-2 py-1.5 text-xs font-bold text-slate-700 flex items-center gap-1 border border-slate-200 pointer-events-auto" id="map-legend">
                    <!-- Injected via JS -->
                </div>
            </div>

            <!-- Locate Me Button -->
            <button onclick="locateUser()" class="absolute bottom-28 right-[11px] z-[400] w-[34px] h-[34px] bg-white rounded shadow-[0_1px_5px_rgba(0,0,0,0.65)] flex items-center justify-center text-slate-700 hover:bg-slate-100 transition-colors pointer-events-auto" title="Find My Location">
                <i class="fa-solid fa-location-crosshairs text-[15px]"></i>
            </button>
        </div>
        
        <!-- AIRBNB-STYLE BOTTOM SHEET (MAP MODE) -->
        <div id="bottom-sheet" class="fixed bottom-0 left-0 right-0 sm:left-auto sm:w-[768px] sm:mx-auto max-h-[85vh] bg-slate-50 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.3)] transform translate-y-full transition-transform duration-300 z-[500] flex flex-col">
            <!-- Drag Handle / Close Header -->
            <div class="bg-white rounded-t-3xl border-b border-slate-200 p-3 shrink-0 flex items-center justify-between sticky top-0 z-20">
                <div class="w-12 h-1.5 bg-slate-300 rounded-full absolute left-1/2 -translate-x-1/2 top-3"></div>
                <h3 id="sheet-title" class="text-xs font-black uppercase tracking-wider text-slate-500 mt-2">Activity Details</h3>
                <button onclick="closeBottomSheet()" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 hover:text-slate-800 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <!-- Reused Content Area inside Sheet -->
            <div id="bottom-sheet-content" class="flex-1 overflow-y-auto p-4 sm:p-8 no-scrollbar pb-12">
                <!-- Rendered dynamically -->
            </div>
        </div>

        <!-- OVERLAY (Darkens map when sheet is up) -->
        <div id="sheet-overlay" onclick="closeBottomSheet()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[450] opacity-0 pointer-events-none transition-opacity duration-300"></div>

        <!-- SYNC MODAL -->
        <div id="sync-banner" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-6 sm:w-80 bg-white rounded-2xl p-4 shadow-[0_10px_40px_rgba(0,0,0,0.2)] border border-slate-200 z-[600] transform translate-y-[150%] opacity-0 transition-all duration-500 pointer-events-none">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-down text-blue-500 animate-bounce"></i>
                    <h3 class="text-sm font-black text-slate-800" id="sync-status-text">Syncing Data...</h3>
                </div>
                <p class="text-xs font-black text-blue-600" id="sync-percentage">0%</p>
            </div>
            <p class="text-[10px] font-semibold text-slate-500 mb-2 truncate" id="sync-detail-text">Preparing cache...</p>
            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden shadow-inner">
                <div id="sync-progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        function initMap() {

                attribution: 'Tiles &copy; Esri'
            }).addTo(map);
        }

        function locateUser() {
            if (!map) return;
            if (!navigator.geolocation) {
                alert("Your browser does not support geolocation.");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    if (userLocationMarker) map.removeLayer(userLocationMarker);
                    userLocationMarker = L.circleMarker([lat, lng], {
                        radius: 8, fillColor: "#3b82f6", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9
                    }).addTo(map).bindTooltip("You are here", { permanent: false, direction: 'top', offset: [0, -10] }).openTooltip();
                    map.flyTo([lat, lng], 11, { animate: true, duration: 1 });
                },
                (error) => {
                    if (error.code === 1) alert("Location access denied. Please allow location permissions in your browser.");
                    else alert("Unable to retrieve location. If you opened this file directly (file://), modern browsers block location access.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function renderMapMarkers() {
            if (!map) return;

                        const marker = L.marker([camp.campSite.lat, camp.campSite.lng], {

                        marker.bindTooltip(`Base Camp: ${camp.shortName}`, { direction: 'top', offset: [0, -20] });
                        bounds.push([camp.campSite.lat, camp.campSite.lng]);
                        mapMarkers.push(marker);
                    }

                    // Add Activities and Eats based on type filters
                    camp.days.forEach((day, dIdx) => {
                        ['optionA', 'optionB'].forEach((optKey) => {
                            const opt = day[optKey];
                            const isNature = optKey === 'optionA';
                            const typeStr = isNature ? 'nature' : 'action';
                            const optionChar = isNature ? 'A' : 'B';
                            
                            // Check if this type (nature/action) is filtered ON
                            if (state.mapFilters.types.includes(typeStr) && opt.lat && opt.lng) {
                                const color = isNature ? 'bg-teal-500' : 'bg-orange-500';
                                const icon = isNature ? 'fa-leaf' : 'fa-bolt';
                                
                                const marker = L.marker([opt.lat, opt.lng], {
                                    icon: createMapIcon(color, icon)
                                }).addTo(map);
                                
                                marker.on('click', () => {
                                    state.campIndex = cIdx; // Sync main state
                                    state.dayIndex = dIdx;
                                    state.option = optionChar;
                                    state.gfEatIndex = 0;
                                    openBottomSheet(opt, optionChar);
                                });
                                
                                bounds.push([opt.lat, opt.lng]);
                                mapMarkers.push(marker);
                            }

                            // Check if EATS are filtered ON
                            if (state.mapFilters.types.includes('eats') && opt.gfEats) {
                                opt.gfEats.forEach((eat, gfIdx) => {
                                    if (eat.lat && eat.lng) {
                                        const marker = L.marker([eat.lat, eat.lng], {

                                            state.option = optionChar;
                                            state.gfEatIndex = gfIdx;
                                            openBottomSheet(opt, optionChar);

                                        bounds.push([eat.lat, eat.lng]);
                                        mapMarkers.push(marker);
                                    }
                                });
                            }
                        });

                }
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }

        async function startCloudSync(force = false) {
            if (isSyncing) return;
            isSyncing = true;
            
            renderDayNav();
            renderContent();
            
            const banner = document.getElementById('sync-banner');
            const progress = document.getElementById('sync-progress-bar');
            const status = document.getElementById('sync-status-text');
            const percentage = document.getElementById('sync-percentage');
            const detailText = document.getElementById('sync-detail-text');
            const syncIcon = document.getElementById('sync-icon');
            const syncButtonBg = document.getElementById('sync-button-bg');
            
            if(syncIcon) syncIcon.classList.add('fa-spin');

            banner.classList.remove('translate-y-[150%]', 'opacity-0');

            const updateVisualProgress = (pct) => {
                progress.style.width = `${pct}%`;
                percentage.innerText = `${pct}%`;
                syncButtonBg.style.background = `conic-gradient(rgba(255,255,255,0.3) ${pct}%, transparent ${pct}%)`;
            };

            status.innerText = "Generating Forecast...";
            updateVisualProgress(5);
            detailText.innerText = "Simulating regional weather models...";
            await new Promise(r => setTimeout(r, 400));

            const conditions = [
                { icon: 'fa-sun text-amber-400', type: 'Sunny' },
                { icon: 'fa-cloud-sun text-amber-500 opacity-90', type: 'Cloudy' },
                { icon: 'fa-cloud-rain text-blue-400', type: 'Rain' }
            ];
            tripData.forEach((camp, cIdx) => {
                camp.days.forEach((day, dIdx) => {
                    const randCond = conditions[Math.floor(Math.random() * conditions.length)];
                    const temp = Math.floor(Math.random() * 11) + 18; 
                    localStorage.setItem(`rv_w_${cIdx}_${dIdx}`, JSON.stringify({ temp, icon: randCond.icon }));
                });
            });
            loadWeatherFromCache();
            renderDayNav();

            status.innerText = "Indexing Topics...";
            updateVisualProgress(10);
            detailText.innerText = "Gathering all points of interest...";
            await new Promise(r => setTimeout(r, 400));

            let allTopics = new Set();
            
            tripData.forEach(camp => {
                camp.days.forEach(day => {
                    [day.optionA, day.optionB].forEach(opt => {
                        if (opt && opt.wikiTopics) {
                            opt.wikiTopics.forEach(t => allTopics.add(t));
                        }
                    });
                });
            });
            const topicsArray = Array.from(allTopics);
            const totalTopics = topicsArray.length;

            status.innerText = "Downloading Images...";
            
            const batchSize = 40;
            let fetchedUrls = [];

            for (let b = 0; b < topicsArray.length; b += batchSize) {
                const batch = topicsArray.slice(b, b + batchSize);
                detailText.innerText = `Querying Wikipedia API (Batch ${Math.floor(b/batchSize) + 1})...`;
                
                try {
                    const queryStr = batch.map(t => encodeURIComponent(t)).join('|');
                    const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&piprop=original&titles=${queryStr}&origin=*`);
                    const data = await res.json();
                    
                    if (data && data.query && data.query.pages) {
                        Object.values(data.query.pages).forEach(page => {
                            if (page.title) {
                                const cacheKey = `rv_img_${page.title}`;
                                if (page.original && page.original.source) {
                                    localStorage.setItem(cacheKey, page.original.source);
                                    fetchedUrls.push(page.original.source);
                                } else {
                                    localStorage.setItem(cacheKey, 'null');
                                }
                            }
                        });
                    }
                } catch (e) {
                    console.error("API Fetch Error", e);
                }

                let apiProgress = 10 + Math.floor(((b + batchSize) / totalTopics) * 90);
                updateVisualProgress(apiProgress);
            }

            status.innerText = "Preloading Images...";
            const totalUrls = fetchedUrls.length;
            let preloadedCount = 0;
            
            if (totalUrls > 0) {
                const maxConcurrency = 10;
                let activePreloads = 0;
                let currentIndex = 0;

                await new Promise(resolve => {
                    function next() {
                        if (preloadedCount >= totalUrls) {
                            resolve();
                            return;
                        }
                        while (activePreloads < maxConcurrency && currentIndex < totalUrls) {
                            activePreloads++;
                            const url = fetchedUrls[currentIndex++];
                            const img = new Image();
                            
                            const onComplete = () => {
                                activePreloads--;
                                preloadedCount++;
                                
                                if (preloadedCount % 5 === 0) renderContent();
                                
                                next();
                            };
                            
                            img.onload = onComplete;
                            img.onerror = onComplete;
                            img.src = url;
                        }
                    }
                    next();
                });
            }

            localStorage.setItem('rv_sync_completed', 'true');

            status.innerText = "Sync Complete!";
            detailText.innerText = "You are now ready for offline roaming.";
            updateVisualProgress(100);
            
            setTimeout(() => {
                banner.classList.add('translate-y-[150%]', 'opacity-0');
                if(syncIcon) syncIcon.classList.remove('fa-spin');
                syncButtonBg.style.background = `conic-gradient(rgba(255,255,255,0.3) 0%, transparent 0%)`;
                isSyncing = false;
                
                setTimeout(() => {
                    loadWeatherFromCache();
                    renderDayNav(); 
                    renderContent(); 
                }, 500);
            }, 2500);
        }

        function loadWeatherFromCache() {
            tripData.forEach((camp, cIdx) => {
                state.weather[cIdx] = {};
                camp.days.forEach((day, dIdx) => {
                    const w = localStorage.getItem(`rv_w_${cIdx}_${dIdx}`);
                    if (w) state.weather[cIdx][dIdx] = JSON.parse(w);
                });
            });
        }

        // Modified to handle toggle logic when in Map View
        function setCamp(index) {
            if (state.view === 'map') {
                const campId = tripData[index].id;
                const filterIdx = state.mapFilters.regions.indexOf(campId);
                if (filterIdx > -1) {
                    state.mapFilters.regions.splice(filterIdx, 1);
                } else {
                    state.mapFilters.regions.push(campId);
                }
                renderCampNav();
                renderMapMarkers();
            } else {
                state.campIndex = index;
                state.dayIndex = 0; 
                state.option = 'A';
                state.gfEatIndex = 0;
                renderCampNav();
                renderCampSiteBanner();
                renderDayNav();
                updateToggleUI();
                renderContent();
            }
        }

        function setDay(index) {
            state.dayIndex = index;
            state.option = 'A';
            state.gfEatIndex = 0;
            renderDayNav(); 
            updateToggleUI();
            renderContent();
        }

        function setOption(opt) {
            state.option = opt;
            state.gfEatIndex = 0;
            updateToggleUI();
            renderContent();
        }
        
        function setGfEat(index) {
            state.gfEatIndex = index;
            renderGfEats(); 
        }

        function sumTravelTime(timeArray) {
            if (!timeArray || !Array.isArray(timeArray)) return "0m";
            
            let totalMinutes = 0;
            const hRegex = /(\d+)\s*h/i;
            const mRegex = /(\d+)\s*m/i;

            timeArray.forEach(timeStr => {
                let hMatch = timeStr.match(hRegex);
                let mMatch = timeStr.match(mRegex);
                
                if (hMatch) totalMinutes += parseInt(hMatch[1], 10) * 60;
                if (mMatch) totalMinutes += parseInt(mMatch[1], 10);
            });

            if (totalMinutes === 0) return "0m";
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            
            if (h > 0 && m > 0) return `${h}h ${m}m`;
            if (h > 0) return `${h}h`;
            return `${m}m`;
        }

        function formatTravelTimeWithIcons(timeArray) {
            if (!timeArray || !Array.isArray(timeArray) || timeArray.length === 0) return '<i class="fa-solid fa-route mx-1.5 text-base"></i> 0m';
            
            return timeArray.map(timeStr => {
                let time = timeStr;
                let mode = '';
                
                let match = timeStr.match(/^([\dh\sm]+)\s*(.*)$/i);
                if (match) {
                    time = match[1].trim();
                    mode = match[2].trim().toLowerCase();
                } else if (timeStr.toLowerCase().includes("walk")) {
                    time = "0m";
                    mode = "walk";
                }
                
                let icon = 'fa-route';
                if (mode.includes('rv')) icon = 'fa-caravan';
                else if (mode.includes('walk')) icon = 'fa-person-walking';
                else if (mode.includes('waterbus') || mode.includes('boat') || mode.includes('ferry')) icon = 'fa-ship';
                else if (mode.includes('bus') || mode.includes('shuttle')) icon = 'fa-bus';
                else if (mode.includes('tram')) icon = 'fa-train-tram';
                else if (mode.includes('cycle') || mode.includes('bike')) icon = 'fa-bicycle';
                
                return `<span class="flex items-center whitespace-nowrap"><i class="fa-solid ${icon} mx-1.5 text-base"></i> ${time}</span>`;
            }).join('<span class="mx-1.5 opacity-40">|</span>');
        }

        function renderCampNav() {
            const nav = document.getElementById('camp-nav');
            
            if (state.view === 'map') {
                // Map mode: Nav acts as multi-select filters
                nav.innerHTML = tripData.map((camp, index) => {
                    const isActive = state.mapFilters.regions.includes(camp.id);
                    const classes = isActive 
                        ? 'bg-blue-600 text-white font-black border-blue-600 shadow-md' 
                        : 'bg-white border-slate-200 text-slate-500 font-bold opacity-70';
                    
                    return `<button onclick="setCamp(${index})" class="snap-center whitespace-nowrap px-4 py-2 rounded-xl text-sm transition-all duration-200 border ${classes}">${camp.shortName}</button>`;
                }).join('');
            } else {
                // List mode: Standard single-select radio button style
                nav.innerHTML = tripData.map((camp, index) => {
                    const isActive = state.campIndex === index;
                    const classes = isActive 
                        ? 'bg-white text-slate-900 font-black border-white shadow-md' 
                        : 'bg-slate-700/50 border-slate-500 text-slate-300 hover:bg-slate-700 font-bold';
                    
                    return `<button onclick="setCamp(${index})" class="snap-center whitespace-nowrap px-4 py-2 rounded-xl text-sm transition-all duration-200 border ${classes}">${camp.shortName}</button>`;
                }).join('');
            }
        }

        function renderCampSiteBanner() {
            const banner = document.getElementById('camp-site-banner');
            const currentCamp = tripData[state.campIndex];
            banner.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="bg-camp text-white w-10 h-10 flex items-center justify-center rounded-lg shadow-sm"><i class="fa-solid fa-home"></i></div>
                    <div>
                        <p class="text-[10px] font-bold text-camp uppercase tracking-wider">Current Camp Site</p>
                        <p class="text-sm font-black text-slate-800 leading-tight">${currentCamp.campSite.name}</p>
                    </div>
                </div>
                <a href="${currentCamp.campSite.mapLink}" target="_blank" class="bg-white border border-blue-200 hover:bg-blue-50 transition-colors text-camp rounded-full w-10 h-10 flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-map-location-dot"></i>
                </a>
            `;
        }

        function renderDayNav() {
            const nav = document.getElementById('day-nav');
            const currentCamp = tripData[state.campIndex];
            
            nav.innerHTML = currentCamp.days.map((day, index) => {
                const isActive = state.dayIndex === index;
                const classes = isActive ? 'bg-slate-800 text-white shadow-md' : 'bg-slate-200 text-slate-700 hover:bg-slate-300';
                
                const w = (state.weather[state.campIndex] && state.weather[state.campIndex][index]) || null;
                
                let weatherHtml = '';
                if (w) {
                    weatherHtml = `<span class="block text-xs font-bold mt-1 opacity-90 tracking-wide"><i class="fa-solid ${w.icon} mr-0.5"></i> ${w.temp}°C</span>`;
                } else if (isSyncing) {
                    weatherHtml = `<span class="block text-[10px] uppercase font-bold mt-1 text-blue-400"><i class="fa-solid fa-spinner fa-spin mr-0.5"></i> Fetching</span>`;
                } else {
                    weatherHtml = `<span class="block text-[10px] uppercase font-bold mt-1 opacity-50 text-slate-400"><i class="fa-solid fa-cloud-arrow-down mr-0.5"></i> Sync</span>`;
                }

                const timeA = sumTravelTime(day.optionA.logistics.travelTime);
                const timeB = sumTravelTime(day.optionB.logistics.travelTime);
                const travelHtml = `<span class="block text-[10px] font-bold mt-0.5 opacity-75"><i class="fa-solid fa-route mr-0.5"></i> ${timeA} | ${timeB}</span>`;

                return `
                    <button onclick="setDay(${index})" class="snap-center flex-1 whitespace-nowrap px-6 py-2 rounded-xl transition-all flex flex-col items-center justify-center ${classes}">
                        <span class="block text-sm font-black">${day.dayLabel}</span>
                        ${weatherHtml}
                        ${travelHtml}
                    </button>
                `;
            }).join('');
        }

        function updateToggleUI() {
            const btnA = document.getElementById('toggle-A');
            const btnB = document.getElementById('toggle-B');

            const currentDay = tripData[state.campIndex].days[state.dayIndex];
            const timeA_html = formatTravelTimeWithIcons(currentDay.optionA.logistics.travelTime);
            const timeB_html = formatTravelTimeWithIcons(currentDay.optionB.logistics.travelTime);

            btnA.innerHTML = `
                <div class="flex flex-col items-center justify-center">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-leaf"></i> Nature / Chill</div>
                    <div class="text-[10px] font-bold mt-1.5 flex items-center justify-center tracking-wide opacity-90">${timeA_html}</div>
                </div>
            `;
            
            btnB.innerHTML = `
                <div class="flex flex-col items-center justify-center">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-bolt"></i> Action / Kids</div>
                    <div class="text-[10px] font-bold mt-1.5 flex items-center justify-center tracking-wide opacity-90">${timeB_html}</div>
                </div>
            `;

            if (state.option === 'A') {
                btnA.className = "flex-1 py-2 text-sm sm:text-base font-black rounded-xl transition-all duration-300 z-10 flex items-center justify-center bg-white text-nature shadow-md border border-slate-100";
                btnB.className = "flex-1 py-2 text-sm sm:text-base font-bold rounded-xl transition-all duration-300 z-10 flex items-center justify-center bg-transparent text-slate-500 hover:text-slate-700";
            } else {
                btnB.className = "flex-1 py-2 text-sm sm:text-base font-black rounded-xl transition-all duration-300 z-10 flex items-center justify-center bg-white text-action shadow-md border border-slate-100";
                btnA.className = "flex-1 py-2 text-sm sm:text-base font-bold rounded-xl transition-all duration-300 z-10 flex items-center justify-center bg-transparent text-slate-500 hover:text-slate-700";
            }
        }

        function renderGfEats() {
            const container = document.getElementById('gf-eats-container');
            if (!container) return;

            const currentDay = tripData[state.campIndex].days[state.dayIndex];
            const data = state.option === 'A' ? currentDay.optionA : currentDay.optionB;

            if (!data.gfEats || data.gfEats.length === 0) {
                container.innerHTML = '';
                return;
            }

            if (state.gfEatIndex >= data.gfEats.length) state.gfEatIndex = 0;
            const activeEat = data.gfEats[state.gfEatIndex];

            const gfTabsHtml = data.gfEats.map((eat, idx) => {
                const isActive = idx === state.gfEatIndex;
                const tabClasses = isActive 
                    ? 'bg-purple-600 text-white font-bold shadow-sm'

                return `<button onclick="setGfEat(${idx})" class="whitespace-nowrap px-4 py-2 rounded-xl text-xs transition-colors shrink-0 ${tabClasses}">${eat.name}</button>`;
            }).join('');

            container.innerHTML = `
                <div class="mt-6 bg-purple-50/50 border border-purple-200 rounded-3xl p-4 sm:p-5 shadow-sm relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 opacity-5 rotate-12 pointer-events-none"><i class="fa-solid fa-wheat-awn-circle-exclamation text-9xl text-gf"></i></div>
                    
                    <div class="relative z-10">
                        <h4 class="text-gf font-black text-sm uppercase tracking-wider mb-4 flex items-center gap-2"><i class="fa-solid fa-shield-heart text-lg"></i> Celiac Safe Eats</h4>
                        
                        <div class="flex overflow-x-auto no-scrollbar gap-2 mb-4 pb-1">
                            ${gfTabsHtml}
                        </div>
                        
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-purple-100 fade-in">
                            <div class="flex justify-between items-start mb-3 gap-2">
                                <h5 class="font-black text-slate-800 text-base leading-tight flex flex-col gap-1">
                                    ${activeEat.name}
                                    <a href="${activeEat.mapLink}" target="_blank" class="text-purple-600 hover:text-purple-800 transition text-[11px] uppercase tracking-wider font-bold flex items-center gap-1.5 w-fit">
                                        <i class="fa-solid fa-map-location-dot"></i> Maps Directions
                                    </a>
                                </h5>
                                <span class="text-[9px] uppercase font-bold text-purple-700 bg-purple-100 px-2.5 py-1 rounded-md shrink-0 whitespace-nowrap">${activeEat.type}</span>
                            </div>
                            
                            <p class="text-xs text-slate-600 font-semibold leading-relaxed bg-purple-50/50 p-3 rounded-xl border border-purple-100">
                                <i class="fa-solid fa-circle-info text-purple-400 mr-1.5"></i> ${activeEat.note}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderContent() {
            const container = document.getElementById('content-area');
            const currentDay = tripData[state.campIndex].days[state.dayIndex];
            const data = state.option === 'A' ? currentDay.optionA : currentDay.optionB;
            
            const themeColor = state.option === 'A' ? 'text-nature' : 'text-action';

            let images = [];
            if (data && data.wikiTopics) {
                data.wikiTopics.forEach(topic => {
                    const cached = localStorage.getItem(`rv_img_${topic}`);
                    if (cached && cached !== 'null') {
                        images.push(cached);
                    }
                });
            }
            
            let carouselHtml = '';
            if (images.length > 0) {
                carouselHtml = `
                    <div class="relative w-full rounded-2xl overflow-hidden shadow-md border border-slate-200 bg-slate-200 mb-5">
                        <div class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar w-full h-64">
                            ${images.map(img => `<div class="min-w-full h-64 snap-center relative"><img src="${img}" class="w-full h-full object-cover" loading="lazy"></div>`).join('')}
                        </div>
                        ${images.length > 1 ? `<div class="absolute bottom-3 right-3 glass-badge text-white text-[10px] px-2.5 py-1 rounded-full font-bold shadow-sm"><i class="fa-solid fa-arrows-left-right"></i> SWIPE (${images.length})</div>` : ''}
                    </div>
                `;
            } else if (isSyncing) {
                carouselHtml = `
                    <div class="w-full rounded-2xl shadow-inner border border-slate-200 bg-slate-200 h-64 flex flex-col items-center justify-center text-blue-500 mb-5 animate-pulse">
                        <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3"></i>
                        <span class="text-sm font-bold opacity-80 uppercase tracking-widest text-center px-4">Downloading Visuals...</span>
                    </div>
                `;
            } else {
                carouselHtml = `
                    <div class="w-full rounded-2xl shadow-inner border border-slate-200 bg-slate-200 h-64 flex flex-col items-center justify-center text-slate-400 mb-5">
                        <i class="fa-solid fa-cloud-arrow-down text-4xl mb-3 opacity-50"></i>
                        <span class="text-sm font-bold opacity-60 uppercase tracking-widest text-center px-4">Cache Empty<br><span class="text-[10px]">Click sync icon in top right</span></span>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="fade-in pb-8 max-w-2xl mx-auto w-full">
                    ${carouselHtml}
                    
                    <div class="mb-5 bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-100 relative">
                        <div class="absolute -top-3 right-5 bg-white px-3 py-1 rounded-full shadow-md text-[10px] font-black uppercase tracking-widest border border-slate-100 ${themeColor}">Option ${state.option}</div>
                        <h2 class="text-2xl font-black text-slate-800 leading-tight mb-4 pr-16 flex items-center gap-3">
                            ${data.title}
                            <a href="${data.mapLink}" target="_blank" class="text-blue-500 hover:text-blue-700 transition" title="Open in Maps">
                                <i class="fa-solid fa-map-location-dot text-lg"></i>
                            </a>
                        </h2>
                        <div class="flex flex-wrap gap-2 mb-4">
                            ${data.tags.map(tag => `<span class="text-xs sm:text-sm px-3 py-1.5 rounded-lg bg-white border border-slate-200 font-bold text-slate-600 shadow-sm flex items-center">${tag}</span>`).join('')}
                        </div>
                        <p class="text-slate-600 text-sm sm:text-base leading-relaxed font-medium mb-4">${data.desc}</p>
                        
                        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 shadow-inner">
                            <h3 class="text-sm font-black uppercase text-slate-700 mb-4 flex items-center"><i class="fa-solid fa-clipboard-list mr-2 opacity-70"></i> Logistics & Gear</h3>
                            
                            <div class="flex items-start gap-3 mb-4">
                                <div class="bg-amber-100 text-amber-600 w-8 h-8 rounded-lg shrink-0 flex items-center justify-center mt-0.5"><i class="fa-regular fa-clock"></i></div>
                                <div><p class="text-[10px] uppercase font-bold text-slate-500">Travel Time Break Down</p><p class="text-sm font-semibold text-slate-800">${data.logistics.travelTime.join(', ')}</p></div>
                            </div>

                            <div class="flex items-start gap-3 mb-4">
                                <div class="bg-blue-100 text-blue-600 w-8 h-8 rounded-lg shrink-0 flex items-center justify-center mt-0.5"><i class="fa-solid fa-van-shuttle"></i></div>
                                <div><p class="text-[10px] uppercase font-bold text-slate-500">RV Access</p><p class="text-sm font-semibold text-slate-800">${data.logistics.rvAccess}</p></div>
                            </div>

                            <div class="flex items-start gap-3 mb-4">
                                <div class="bg-rose-100 text-rose-600 w-8 h-8 rounded-lg shrink-0 flex items-center justify-center mt-0.5"><i class="fa-solid fa-baby-carriage"></i></div>
                                <div><p class="text-[10px] uppercase font-bold text-slate-500">Baby Gear</p><p class="text-sm font-semibold text-slate-800">${data.logistics.strollerOrCarrier}</p></div>
                            </div>

                            <div class="flex items-start gap-3">
                                <div class="bg-emerald-100 text-emerald-600 w-8 h-8 rounded-lg shrink-0 flex items-center justify-center mt-0.5">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-4 h-4 fill-current"><path d="M224 0C135.6 0 64 71.6 64 160V192H48C21.5 192 0 213.5 0 240V368C0 394.5 21.5 416 48 416H64V448C64 483.3 92.7 512 128 512H320C355.3 512 384 483.3 384 448V416H400C426.5 416 448 394.5 448 368V240C448 213.5 426.5 192 400 192H384V160C384 71.6 312.4 0 224 0zM128 160C128 107 171 64 224 64C277 64 320 107 320 160V192H128V160zM160 256H288C296.8 256 304 263.2 304 272V304C304 312.8 296.8 320 288 320H160C151.2 320 144 312.8 144 304V272C144 263.2 151.2 256 160 256z"/></svg>
                                </div>
                                <div><p class="text-[10px] uppercase font-bold text-slate-500 mb-1">Situational Gear</p>
                                <div class="flex flex-wrap gap-1.5 mt-1">${data.logistics.packingList.map(item => `<span class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded-md shadow-sm">${item}</span>`).join('')}</div></div>
                            </div>
                        </div>
                    </div>

                    <div id="gf-eats-container"></div>
                </div>
            `;
            
            renderGfEats();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadWeatherFromCache();
            renderCampNav();
            renderCampSiteBanner();
            renderDayNav();
            updateToggleUI();
            renderContent();

            const isCached = localStorage.getItem('rv_sync_completed');
            if (!isCached) {
                startCloudSync();
            }
        });
    </script>
</body>
</html>
